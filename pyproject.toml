[project]
name = "python-application-reference"
version = "0.1.0"
description = "Reference implementation of a Python web application"
readme = "README.md"

dependencies = [
	"fastapi[standard]==0.143.3",
	"starlette==1.8.0",
	"anyio==4.15.1",
]

[tool.uv.workspace]
members = [
	"logging"
]

[tool.ruff]
target-version = "py314"
line-length = 119

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "FAST", "ANN"]

[dependency-groups]
dev = [
	"ruff>=0.17.1",
]
